name: CI

on:
  pull_request:
  push:
    # main and staging run this through their deploy workflows.
    branches-ignore: [main, staging]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test & build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The Worker serves the exported site, so its tests need the build output.
      - name: Build site
        run: npm run build

      - name: Test
        run: npm test
