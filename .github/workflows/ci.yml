name: CI

on:
  pull_request:
  push:
    # main and staging run this through their deploy workflows.
    branches-ignore: [main, staging]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The Worker serves the exported site, so its tests need the build output.
      - name: Build site
        run: npm run build

      - name: Test
        run: npm test
